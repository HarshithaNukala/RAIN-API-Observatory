version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rain_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rain_db}
      POSTGRES_USER: ${POSTGRES_USER:-rain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rain_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rain_user} -d ${POSTGRES_DB:-rain_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
